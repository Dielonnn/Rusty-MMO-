[workspace]
resolver = "3"
members = ["shared", "server", "client"]
default-members = ["client"]

[workspace.package]
version = "3.0.0"
edition = "2024"

[workspace.dependencies]
bincode = "1"
glam = { version = "0.27", features = ["serde"] }
macroquad = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
shared = { path = "shared" }
server = { path = "server" }

# Dependencies are slow to run unoptimized; optimize them even in debug builds.
[profile.dev.package."*"]
opt-level = 2
